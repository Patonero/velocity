<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' file: data:;
        font-src 'self';
        connect-src 'none';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        frame-ancestors 'none';
    ">
    <title>Velocity Launcher</title>
    <link rel="stylesheet" href="splash.css">
</head>

<body>
    <div class="splash-container">
        <div class="splash-content">
            <!-- Logo/Icon -->
            <div class="splash-logo">
                <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h12l1.5 5.5a2 2 0 0 1-1.93 2.5 2 2 0 0 1-1.8-1.13L15 17H9l-.77 1.87A2 2 0 0 1 6.43 20a2 2 0 0 1-1.93-2.5L6 12Z"/><path d="M6 12 7.2 6.6A3 3 0 0 1 10.13 4h3.74a3 3 0 0 1 2.93 2.6L18 12"/><line x1="9" y1="14.5" x2="9" y2="16.5"/><line x1="8" y1="15.5" x2="10" y2="15.5"/><circle cx="15" cy="14.5" r="0.9" fill="currentColor" stroke="none"/><circle cx="17" cy="16.5" r="0.9" fill="currentColor" stroke="none"/></svg></div>
                <h1 class="app-name">Velocity Launcher</h1>
                <p class="app-tagline">Emulator Management Made Easy</p>
            </div>

            <!-- Loading indicator (branding only - update work happens in the
                 main window now) -->
            <div class="loading-section">
                <div id="loading-initial" class="loading-state active">
                    <div class="spinner"></div>
                    <p class="loading-text">Starting Velocity Launcher...</p>
                </div>
            </div>

            <!-- Version Info -->
            <div class="version-info">
                <span id="current-version">v1.1.0</span>
            </div>
        </div>
    </div>

    <script src="../dist/splash.js"></script>
</body>

</html>
